<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650" fill="none">
  <defs>
    <!-- 3D Ambient Drop Shadow -->
    <filter id="maleDocShadow" x="-30%" y="-20%" width="160%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#041E28" flood-opacity="0.55" />
      <feDropShadow dx="-8" dy="12" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.3" />
    </filter>

    <!-- Glowing Prescription Seal -->
    <filter id="sealGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Warm African Skin Tone Gradients -->
    <linearGradient id="maleSkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5672D" />
      <stop offset="40%" stop-color="#844D1E" />
      <stop offset="80%" stop-color="#59310F" />
      <stop offset="100%" stop-color="#3D2008" />
    </linearGradient>

    <radialGradient id="maleFaceShade" cx="48%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#BA7837" />
      <stop offset="45%" stop-color="#935522" />
      <stop offset="85%" stop-color="#6B3A13" />
      <stop offset="100%" stop-color="#472409" />
    </radialGradient>

    <!-- Hair & Beard Gradient -->
    <linearGradient id="maleHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1C12" />
      <stop offset="50%" stop-color="#140D08" />
      <stop offset="100%" stop-color="#050302" />
    </linearGradient>

    <!-- White Doctor Coat Gradients -->
    <linearGradient id="maleCoatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Royal Navy Scrub Shirt Gradient -->
    <linearGradient id="navyScrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Metallic Accents -->
    <linearGradient id="maleMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="65%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="maleStethTube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
  </defs>

  <g filter="url(#maleDocShadow)">
    <!-- BACK HAIR & SHAPE -->
    <ellipse cx="225" cy="110" rx="72" ry="78" fill="url(#maleHairGrad)" />
    <!-- Fade textured curls on sides -->
    <path d="M152 110 C152 70, 298 70, 298 110 L298 145 C298 150, 288 155, 280 145 C280 100, 170 100, 170 145 C162 155, 152 150, 152 145 Z" fill="url(#maleHairGrad)" />

    <!-- NECK & COLLAR -->
    <path d="M194 185 L194 255 L256 255 L256 185 Z" fill="url(#maleSkinGrad)" />
    <!-- Adam's Apple & Neck Shadow -->
    <path d="M220 215 L225 224 L230 215" stroke="#472409" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <ellipse cx="225" cy="202" rx="28" ry="10" fill="#3D2008" opacity="0.4" />

    <!-- ROYAL BLUE MEDICAL SCRUB SHIRT -->
    <path d="M180 240 L270 240 L280 320 L170 320 Z" fill="url(#navyScrubGrad)" />
    <!-- V-Neck Opening -->
    <path d="M202 240 L225 275 L248 240 Z" fill="url(#maleSkinGrad)" />

    <!-- FAST CARE NOW LANYARD WITH DOCTOR ID -->
    <path d="M214 240 L210 338 L220 338 L218 240 Z" fill="#2DD4BF" />
    <path d="M236 240 L240 338 L230 338 L232 240 Z" fill="#2DD4BF" />
    <rect x="204" y="328" width="42" height="56" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="208" y="333" width="34" height="6" fill="#0D9488" rx="2" />
    <circle cx="218" cy="354" r="6" fill="#A5672D" />
    <line x1="228" y1="350" x2="240" y2="350" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="228" y1="356" x2="238" y2="356" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <text x="210" y="377" fill="#0A7EA4" font-family="system-ui, sans-serif" font-size="5" font-weight="900">FCN • CHIEF MD</text>

    <!-- HEAD & FACIAL STRUCTURE -->
    <g id="maleHead">
      <!-- Ears -->
      <ellipse cx="148" cy="150" rx="14" ry="18" fill="url(#maleSkinGrad)" />
      <ellipse cx="148" cy="150" rx="8" ry="12" fill="#59310F" opacity="0.5" />
      <ellipse cx="302" cy="150" rx="14" ry="18" fill="url(#maleSkinGrad)" />
      <ellipse cx="302" cy="150" rx="8" ry="12" fill="#59310F" opacity="0.5" />

      <!-- Main Face Shape (Square, strong jawline) -->
      <path d="M158 125 C158 70, 292 70, 292 125 C292 180, 265 218, 225 218 C185 218, 158 180, 158 125 Z" fill="url(#maleFaceShade)" />

      <!-- Neat Top Hair Fade -->
      <path d="M155 110 C162 75, 205 60, 225 60 C245 60, 288 75, 295 110 C280 92, 260 84, 225 84 C190 84, 170 92, 155 110 Z" fill="url(#maleHairGrad)" />

      <!-- Eyebrows -->
      <path d="M180 126 C192 120, 204 122, 210 128" stroke="#140D08" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M270 126 C258 120, 246 122, 240 128" stroke="#140D08" stroke-width="4.5" stroke-linecap="round" fill="none" />

      <!-- Eyes (Warm, focused, friendly) -->
      <!-- Left Eye -->
      <ellipse cx="195" cy="138" rx="10" ry="6.5" fill="#FFFFFF" />
      <ellipse cx="196" cy="138" rx="5.5" ry="5.5" fill="#3D2008" />
      <circle cx="196" cy="138" r="3.5" fill="#0A0604" />
      <circle cx="194" cy="136" r="1.8" fill="#FFFFFF" /> <!-- Catchlight -->
      <!-- Right Eye -->
      <ellipse cx="255" cy="138" rx="10" ry="6.5" fill="#FFFFFF" />
      <ellipse cx="254" cy="138" rx="5.5" ry="5.5" fill="#3D2008" />
      <circle cx="254" cy="138" r="3.5" fill="#0A0604" />
      <circle cx="252" cy="136" r="1.8" fill="#FFFFFF" /> <!-- Catchlight -->

      <!-- STYLISH MODERN MEDICAL GLASSES (ROUNDED RECTANGULAR WIRE-FRAME) -->
      <g id="glasses">
        <!-- Left Frame -->
        <rect x="175" y="124" width="40" height="28" rx="8" stroke="url(#maleMetalGrad)" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.08" />
        <!-- Right Frame -->
        <rect x="235" y="124" width="40" height="28" rx="8" stroke="url(#maleMetalGrad)" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.08" />
        <!-- Bridge Bar -->
        <path d="M215 134 Q225 130 235 134" stroke="url(#maleMetalGrad)" stroke-width="2.5" fill="none" />
        <!-- Temples to ears -->
        <line x1="175" y1="130" x2="152" y2="136" stroke="url(#maleMetalGrad)" stroke-width="2" />
        <line x1="275" y1="130" x2="298" y2="136" stroke="url(#maleMetalGrad)" stroke-width="2" />
        <!-- Specular reflection streak on glass -->
        <line x1="182" y1="144" x2="202" y2="128" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6" stroke-linecap="round" />
        <line x1="242" y1="144" x2="262" y2="128" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6" stroke-linecap="round" />
      </g>

      <!-- Nose (Defined, masculine structure) -->
      <path d="M225 135 L222 165 C217 166, 216 172, 221 173 C224 173.5, 226 173.5, 229 173 C234 172, 233 166, 228 165" 
            stroke="#59310F" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <ellipse cx="225" cy="170" rx="7" ry="3.5" fill="#6B3A13" opacity="0.45" />

      <!-- NEATLY TRIMMED BEARD & MUSTACHE (STYLISH PROFESSIONAL) -->
      <path d="M208 178 Q225 174 242 178 Q225 183 208 178 Z" fill="url(#maleHairGrad)" /> <!-- Mustache -->
      <!-- Beard Outline along jawline and chin -->
      <path d="M165 150 C165 190, 190 218, 225 218 C260 218, 285 190, 285 150 C280 185, 255 210, 225 210 C195 210, 170 185, 165 150 Z" fill="url(#maleHairGrad)" />

      <!-- Warm Smile (Reassuring doctor expression) -->
      <path d="M211 188 Q225 200 239 188 Z" fill="#78350F" />
      <path d="M214 188 Q225 195 236 188 Z" fill="#FFFFFF" /> <!-- Clean teeth -->
      <path d="M210 186 Q225 188 240 186" stroke="#451A03" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <!-- DOCTOR'S WHITE COAT -->
    <!-- Shoulders & Upper Body -->
    <path d="M170 240 C135 255, 95 295, 80 365 C75 390, 80 450, 90 520 L150 520 L155 380 L180 280 Z" fill="url(#maleCoatGrad)" />
    <path d="M280 240 C315 255, 355 295, 370 365 C380 410, 385 465, 380 520 L320 520 L305 380 L270 280 Z" fill="url(#maleCoatGrad)" />
    <path d="M160 270 L170 620 L280 620 L290 270 Z" fill="url(#maleCoatGrad)" />

    <!-- Lapels -->
    <path d="M192 240 L155 350 L208 350 L212 240 Z" fill="#FFFFFF" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.12))" />
    <path d="M258 240 L295 350 L242 350 L238 240 Z" fill="#FFFFFF" filter="drop-shadow(-2px 4px 6px rgba(0,0,0,0.12))" />

    <!-- Pocket with Medical Pens -->
    <rect x="130" y="375" width="44" height="50" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="140" y="365" width="4" height="18" rx="2" fill="url(#maleMetalGrad)" />
    <rect x="150" y="367" width="4" height="16" rx="2" fill="#0D9488" />

    <!-- Buttons -->
    <circle cx="225" cy="400" r="5.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="225" cy="460" r="5.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="225" cy="520" r="5.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />

    <!-- TEAL STETHOSCOPE -->
    <g id="maleStethoscope">
      <path d="M182 240 C182 275, 202 315, 210 365" stroke="url(#maleStethTube)" stroke-width="11" stroke-linecap="round" fill="none" />
      <path d="M268 240 C268 275, 248 315, 240 365" stroke="url(#maleStethTube)" stroke-width="11" stroke-linecap="round" fill="none" />
      <path d="M240 365 C240 420, 208 435, 204 470" stroke="url(#maleStethTube)" stroke-width="11" stroke-linecap="round" fill="none" />
      
      <!-- Chrome Bell & Diaphragm -->
      <circle cx="204" cy="482" r="23" fill="url(#maleMetalGrad)" />
      <circle cx="204" cy="482" r="19" fill="#042F2E" />
      <circle cx="204" cy="482" r="15" fill="#0D9488" />
      <circle cx="204" cy="482" r="6" fill="url(#maleMetalGrad)" />
      <path d="M195 475 A 13 13 0 0 1 213 475" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- LEFT HAND HOLDING CLINICAL DIAGNOSTIC CLIPBOARD -->
    <g id="clinicalClipboard" transform="translate(85, 380) rotate(8)">
      <!-- Board Base -->
      <rect x="0" y="0" width="130" height="175" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="3" filter="drop-shadow(6px 14px 18px rgba(0,0,0,0.35))" />
      <!-- Paper Sheet -->
      <rect x="8" y="10" width="114" height="155" rx="8" fill="#F8FAFC" />
      <!-- Metallic Clip -->
      <rect x="42" y="2" width="46" height="18" rx="4" fill="url(#maleMetalGrad)" />

      <!-- Rx & Patient Record Header -->
      <text x="16" y="34" fill="#0D9488" font-family="system-ui, sans-serif" font-size="10" font-weight="800">CLINICAL TRIAGE</text>
      <text x="86" y="34" fill="#0A7EA4" font-family="Georgia, serif" font-size="16" font-weight="900" font-style="italic">℞</text>

      <!-- Medical Lines on Paper -->
      <line x1="16" y1="48" x2="114" y2="48" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <line x1="16" y1="62" x2="95" y2="62" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <line x1="16" y1="76" x2="108" y2="76" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <line x1="16" y1="90" x2="80" y2="90" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

      <!-- Cryptographic QR / Verification Seal -->
      <rect x="16" y="105" width="34" height="34" rx="6" fill="#F1F5F9" stroke="#0D9488" stroke-width="1.5" />
      <rect x="20" y="109" width="8" height="8" fill="#0D9488" />
      <rect x="38" y="109" width="8" height="8" fill="#0D9488" />
      <rect x="20" y="127" width="8" height="8" fill="#0D9488" />
      <rect x="32" y="121" width="5" height="5" fill="#0A7EA4" />

      <!-- Doctor Signature -->
      <path d="M 60 130 Q 75 115, 90 130 T 110 128" stroke="#0369A1" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <text x="60" y="146" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700">Dr. Desta • Dire Dawa</text>

      <!-- Fingers wrapping around clipboard -->
      <path d="M124 75 C132 75, 138 60, 130 50 C125 45, 115 50, 114 60 Z" fill="url(#maleSkinGrad)" />
      <ellipse cx="120" cy="85" rx="6" ry="12" fill="url(#maleSkinGrad)" />
      <ellipse cx="120" cy="105" rx="6" ry="12" fill="url(#maleSkinGrad)" />
    </g>

    <!-- RIGHT HAND: CONFIDENT WELCOMING / THUMBS-UP GESTURE -->
    <g id="rightHand" transform="translate(330, 420) rotate(-12)">
      <!-- Hand Base -->
      <path d="M0 20 C0 0, 30 0, 35 20 C38 40, 5 45, 0 20 Z" fill="url(#maleSkinGrad)" />
      <!-- Fingers curled warmly -->
      <ellipse cx="18" cy="22" rx="10" ry="14" fill="url(#maleSkinGrad)" />
      <!-- Reassuring gesture -->
      <path d="M14 8 C14 -8, 28 -8, 28 8 L28 20 L14 20 Z" fill="url(#maleSkinGrad)" />
      <ellipse cx="21" cy="-4" rx="6" ry="7" fill="url(#maleSkinGrad)" />
    </g>
  </g>
</svg>
