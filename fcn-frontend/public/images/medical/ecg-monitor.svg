<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="monitorShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0A7EA4" flood-opacity="0.3" />
    </filter>

    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#081A2D" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="45%" stop-color="#2DD4BF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>
  </defs>

  <g filter="url(#monitorShadow)" transform="translate(250, 250) rotate(6) translate(-250, -250)">
    <!-- Monitor Outer Glass Bezel -->
    <rect x="70" y="110" width="360" height="260" rx="28" fill="#1E293B" stroke="#334155" stroke-width="4" />
    
    <!-- Screen Area -->
    <rect x="85" y="125" width="330" height="230" rx="18" fill="url(#screenBg)" />

    <!-- Grid Lines (Hospital Monitor Grid) -->
    <g opacity="0.12" stroke="#2DD4BF" stroke-width="1">
      <line x1="85" y1="160" x2="415" y2="160" />
      <line x1="85" y1="200" x2="415" y2="200" />
      <line x1="85" y1="240" x2="415" y2="240" />
      <line x1="85" y1="280" x2="415" y2="280" />
      <line x1="85" y1="320" x2="415" y2="320" />
      
      <line x1="130" y1="125" x2="130" y2="355" />
      <line x1="180" y1="125" x2="180" y2="355" />
      <line x1="230" y1="125" x2="230" y2="355" />
      <line x1="280" y1="125" x2="280" y2="355" />
      <line x1="330" y1="125" x2="330" y2="355" />
      <line x1="380" y1="125" x2="380" y2="355" />
    </g>

    <!-- Vital Stats Header -->
    <text x="105" y="156" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">HR: 72 BPM</text>
    <text x="325" y="156" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">SpO2: 98%</text>

    <!-- ECG Heart Rhythm Waveform -->
    <path d="M 95 240 L 140 240 L 155 225 L 170 240 L 185 240 L 195 255 L 210 160 L 225 305 L 240 220 L 255 245 L 270 240 L 320 240 L 330 230 L 340 240 L 405 240" 
          stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#ecgGlow)" />
    
    <!-- Glowing Pulse Lead Dot -->
    <circle cx="210" cy="160" r="5" fill="#FFFFFF" filter="url(#ecgGlow)" />

    <!-- Glass Specular Reflection Sweep -->
    <path d="M 85 125 L 240 125 L 140 355 L 85 355 Z" fill="#FFFFFF" opacity="0.04" />
  </g>
</svg>
