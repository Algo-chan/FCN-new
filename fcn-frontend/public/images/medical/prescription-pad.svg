<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <filter id="padShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="10" dy="16" stdDeviation="14" flood-color="#0A2540" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A7EA4" flood-opacity="0.2" />
    </filter>

    <linearGradient id="padPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="clipMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="rxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A7EA4" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>

  <g filter="url(#padShadow)" transform="translate(250, 250) rotate(-10) translate(-250, -250)">
    <!-- Clipboard Wooden/Dark Base -->
    <rect x="80" y="80" width="340" height="360" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="4" />

    <!-- Medical Paper Sheet -->
    <rect x="95" y="105" width="310" height="320" rx="14" fill="url(#padPaperGrad)" />

    <!-- Paper Header Banner -->
    <rect x="95" y="105" width="310" height="42" rx="14" fill="#0A7EA4" />
    <text x="120" y="132" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">FAST CARE NOW • Rx</text>

    <!-- Metallic Clip at Top -->
    <path d="M190 70 L310 70 C316 70, 320 74, 320 80 L320 115 L180 115 L180 80 C180 74, 184 70, 190 70 Z" fill="url(#clipMetalGrad)" />
    <circle cx="250" cy="92" r="7" fill="#0F172A" />

    <!-- Big Rx Symbol -->
    <text x="120" y="210" fill="url(#rxGrad)" font-family="Georgia, serif" font-size="52" font-weight="900" font-style="italic">℞</text>

    <!-- Prescription Lines -->
    <line x1="180" y1="185" x2="380" y2="185" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="205" x2="340" y2="205" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="245" x2="380" y2="245" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="275" x2="380" y2="275" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="305" x2="300" y2="305" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Digital QR Verification Badge -->
    <rect x="120" y="340" width="55" height="55" rx="8" fill="#F1F5F9" stroke="#0A7EA4" stroke-width="2" />
    <!-- Mini QR Pattern -->
    <rect x="126" y="346" width="14" height="14" fill="#0A7EA4" />
    <rect x="155" y="346" width="14" height="14" fill="#0A7EA4" />
    <rect x="126" y="375" width="14" height="14" fill="#0A7EA4" />
    <rect x="146" y="366" width="8" height="8" fill="#0D9488" />
    <rect x="161" y="381" width="8" height="8" fill="#0D9488" />

    <!-- Doctor Signature Wave -->
    <path d="M 230 380 Q 250 360, 270 380 T 310 375 T 350 380" stroke="#0A2540" stroke-width="3" stroke-linecap="round" fill="none" />
    <text x="240" y="405" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Verified MD Signature</text>
  </g>
</svg>
