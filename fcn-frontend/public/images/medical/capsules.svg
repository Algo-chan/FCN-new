<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Ambient Shadow -->
    <filter id="capsuleShadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#0A2540" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D9488" flood-opacity="0.25" />
    </filter>

    <!-- Capsule 1: Teal Cyan Theme -->
    <linearGradient id="tealCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="40%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="cyanCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Capsule 2: Coral / Amber Theme -->
    <linearGradient id="coralCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="40%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="amberCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
  </defs>

  <g filter="url(#capsuleShadow)">
    <!-- Primary Big Capsule (Angled 35deg) -->
    <g transform="translate(240, 220) rotate(-32)">
      <!-- Capsule Body (Width: 100, Height: 240) -->
      <!-- Top Half (Teal) -->
      <path d="M-45 0 C-45 -60, 45 -60, 45 0 L45 2 Z" fill="url(#tealCapGrad)" />
      <!-- Bottom Half (Cyan) -->
      <path d="M-45 2 L45 2 L45 80 C45 140, -45 140, -45 80 Z" fill="url(#cyanCapGrad)" />
      
      <!-- Center Joining Seam -->
      <rect x="-46" y="-1" width="92" height="4" rx="2" fill="#0F172A" opacity="0.3" />
      <rect x="-45" y="0" width="90" height="2" fill="#FFFFFF" opacity="0.4" />

      <!-- Specular Highlight Strip (Glass sheen) -->
      <path d="M-30 -40 C-30 -50, -15 -55, 0 -55 C-25 -50, -25 90, 0 100 C-15 95, -30 90, -30 80 Z" fill="#FFFFFF" opacity="0.45" />
      <ellipse cx="-22" cy="-25" rx="8" ry="18" fill="#FFFFFF" opacity="0.6" transform="rotate(-10 -22 -25)" />
      <ellipse cx="-20" cy="50" rx="6" ry="14" fill="#FFFFFF" opacity="0.5" transform="rotate(-5 -20 50)" />
    </g>

    <!-- Secondary Smaller Capsule (Floating Behind/Above, Angled 45deg) -->
    <g transform="translate(130, 160) rotate(42) scale(0.68)">
      <!-- Top Half (Coral) -->
      <path d="M-40 0 C-40 -55, 40 -55, 40 0 L40 2 Z" fill="url(#coralCapGrad)" />
      <!-- Bottom Half (Amber/White) -->
      <path d="M-40 2 L40 2 L40 70 C40 125, -40 125, -40 70 Z" fill="url(#amberCapGrad)" />
      
      <!-- Seam -->
      <rect x="-41" y="-1" width="82" height="3" rx="1.5" fill="#4C0519" opacity="0.35" />
      <!-- Specular Highlight -->
      <ellipse cx="-18" cy="-20" rx="7" ry="15" fill="#FFFFFF" opacity="0.55" />
      <ellipse cx="-16" cy="40" rx="5" ry="12" fill="#FFFFFF" opacity="0.45" />
    </g>

    <!-- Floating Tiny Tablet (Round Pill) -->
    <g transform="translate(360, 340) rotate(18)">
      <ellipse cx="0" cy="0" rx="36" ry="24" fill="#F8FAFC" />
      <path d="M-36 0 C-36 12, 36 12, 36 0 L36 8 C36 20, -36 20, -36 8 Z" fill="#CBD5E1" />
      <!-- Pill Center Score Line -->
      <line x1="-22" y1="-3" x2="22" y2="3" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
      <!-- Highlight -->
      <ellipse cx="-10" cy="-6" rx="16" ry="6" fill="#FFFFFF" opacity="0.75" />
    </g>
  </g>
</svg>
