<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0A7EA4" />
    <meta
      name="description"
      content="Fast Care Now connects patients with immediate, reliable healthcare services. Book appointments, find providers, and get care fast."
    />
    <title>Fast Care Now | Immediate Healthcare Services</title>
    <link rel="canonical" href="https://fcncare.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">

    <!-- Open Graph -->
    <meta property="og:title" content="Fast Care Now">
    <meta property="og:description" content="Immediate healthcare services at your fingertips.">
    <meta property="og:image" content="https://fcncare.com/assets/og-image.png">
    <meta property="og:url" content="https://fcncare.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fast Care Now">
    <meta name="twitter:description" content="Immediate healthcare services at your fingertips.">
    <meta name="twitter:image" content="https://fcncare.com/assets/og-image.png">

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fast Care Now",
      "url": "https://fcncare.com",
      "logo": "https://fcncare.com/assets/logo-fast-care-now.png",
      "sameAs": [
        "https://www.linkedin.com/company/fast-care-now",
        "https://twitter.com/fastcarenow"
      ],
      "description": "Fast Care Now connects patients with immediate, reliable healthcare services."
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fast Care Now",
      "url": "https://fcncare.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://fcncare.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Fast Care Now",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "ETB"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
