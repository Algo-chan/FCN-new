          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fast Care Now (FCN) is Ethiopia's first complete digital healthcare platform. It allows patients to book licensed doctors online, get AI health checks in Amharic, Somali, Oromo or English, receive e-prescriptions, and request nurse home visits — all from their smartphone."
          }
        },
        {
          "@type": "Question",
          "name": "Where is FCN available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FCN is currently live in Dire Dawa, Ethiopia. We plan to expand to other Ethiopian cities including Addis Ababa, Harar, and Adama based on pilot success."
          }
        },
        {
          "@type": "Question",
          "name": "How much does FCN cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FCN consultations are free during our pilot period in Dire Dawa. After the pilot, standard consultations will be 50 ETB. Creating an account is always free."
          }
        },
        {
          "@type": "Question",
          "name": "What languages does FCN support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FCN's AI Health Assistant supports 4 languages: English, Amharic (አማርኛ), Somali (Soomaali), and Oromo (Afaan Oromoo). The platform interface is in English."
          }
        },
        {
          "@type": "Question",
          "name": "How do I register on Fast Care Now?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Visit app.fcncare.com, click Get Started, fill in your name, email and create a password. You'll receive a verification code to your email. After verifying, complete your health profile and start booking doctors."
          }
        }
      ]
